name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Windows 提交的文件没有执行权限，Linux 上先授权（经典坑）
      - name: 授权 mvnw 可执行
        run: chmod +x mvnw
      - name: 编译 + 测试
        run: ./mvnw test

spring.application.name=weather-server

# 数据库凭证走环境变量（DB_USER / DB_PASS），不写进仓库
# 本地开发：在终端先执行 . .\dev-env.ps1；服务器：写在 systemd 的 Environment= 里
spring.datasource.url=jdbc:mysql://localhost:3306/timetable_app
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASS:}

# LLM（课表文件转换）：API key 走环境变量 LLM_API_KEY，不写在这里
llm.api.url=https://api.deepseek.com/chat/completions
llm.model=deepseek-flash

# Redis：本地开发走 SSH 隧道（ssh -L 6379:localhost:6379），服务器上就是本机
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 反向代理后还原真实客户端 IP：Tomcat RemoteIpValve 读取 X-Forwarded-For，
# 让 getRemoteAddr()（限流用的）拿到客户端真实 IP，而不是 nginx 的 127.0.0.1
server.forward-headers-strategy=native